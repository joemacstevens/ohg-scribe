services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      - DATABASE_URL=postgresql://ohgscribe:ohgscribe@db:5432/ohgscribe
      - STATIC_DIR=/app/frontend/dist
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ohgscribe
      POSTGRES_PASSWORD: ohgscribe
      POSTGRES_DB: ohgscribe
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohgscribe"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
