services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      - DATABASE_URL=postgresql+psycopg://launchpadscribe:launchpadscribe@db:5432/launchpadscribe
      - STATIC_DIR=/app/frontend/dist
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: launchpadscribe
      POSTGRES_PASSWORD: launchpadscribe
      POSTGRES_DB: launchpadscribe
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchpadscribe"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
